<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwapMyBook — Exchange Request</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen">
<a href="#main" class="skip-link">Skip to content</a>

<header class="site-header">
  <div class="max-w-7xl mx-auto px-5 md:px-8 flex items-center justify-between h-16">
    <a href="index.html" class="flex items-center gap-2">
      <span class="logo-badge"><i class="fa-solid fa-book-open-reader"></i></span>
      <span class="font-display font-bold text-lg">Swap<span class="brand-gradient-text">mybook</span></span>
    </a>
    <nav class="hidden md:flex items-center gap-7 text-sm">
      <a href="add-book.html" class="nav-link">Add Book</a>
      <a href="search-book.html" class="nav-link">Search</a>
      <a href="exchange-request.html" class="nav-link active">Exchange</a>
      <a href="profile.html" class="nav-link">Profile</a>
      <a href="contact.html" class="nav-link">Contact</a>
      <a href="feedback.html" class="nav-link">Feedback</a>
    </nav>
    <div class="hidden md:flex items-center gap-3">
      <a href="index.html" class="btn-outline px-4 py-2 text-sm">Login</a>
      <a href="register.html" class="btn-primary px-4 py-2 text-sm">Sign Up</a>
    </div>
    <button id="navToggle" class="md:hidden text-xl text-[var(--teal-700)]" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
  </div>
  <div id="mobileMenu" class="hidden md:hidden border-t border-[var(--line)] px-5 py-4 flex flex-col gap-3 text-sm bg-white">
    <a href="add-book.html" class="nav-link">Add Book</a>
    <a href="search-book.html" class="nav-link">Search</a>
    <a href="exchange-request.html" class="nav-link">Exchange</a>
    <a href="profile.html" class="nav-link">Profile</a>
    <a href="contact.html" class="nav-link">Contact</a>
    <a href="feedback.html" class="nav-link">Feedback</a>
    <a href="index.html" class="btn-outline px-4 py-2 text-sm text-center">Login</a>
  </div>
</header>

<main id="main" class="max-w-3xl mx-auto px-5 md:px-8 py-10 md:py-14">
  <div class="text-center mb-8" data-aos="fade-up">
    <div class="w-14 h-14 mx-auto rounded-2xl bg-[var(--green-500)]/10 text-[var(--green-700)] flex items-center justify-center mb-4 text-2xl"><i class="fa-solid fa-arrows-rotate"></i></div>
    <h1 class="font-display text-2xl md:text-3xl font-bold">Request Book Exchange</h1>
    <p class="text-[var(--muted)] text-sm mt-1">Offer one of your books to request another.</p>
  </div>

  <form data-demo-form data-success-text="Exchange request sent to the owner!" class="card p-7 md:p-10 space-y-5" novalidate data-aos="fade-up" data-aos-delay="100">
    <div class="grid md:grid-cols-2 gap-5">
      <div>
        <label for="reqBook" class="block text-sm font-semibold mb-1.5">Request Book *</label>
        <div class="field-wrap"><i class="fa-solid fa-book input-icon"></i>
          <select id="reqBook" required class="input-field appearance-none">
            <option value="">Select Book</option>
            <option>Data Structures — R. Gilberg</option>
            <option>Operating Systems — Galvin</option>
            <option>DBMS Concepts — Korth</option>
          </select></div>
      </div>
      <div>
        <label for="yourBook" class="block text-sm font-semibold mb-1.5">Your Book *</label>
        <div class="field-wrap"><i class="fa-solid fa-book-bookmark input-icon"></i>
          <select id="yourBook" required class="input-field appearance-none">
            <option value="">Select Your Book</option>
            <option>Computer Networks — Tanenbaum</option>
            <option>Java Programming — Balaguruswamy</option>
          </select></div>
      </div>
    </div>

    <div>
      <label for="ownerName" class="block text-sm font-semibold mb-1.5">Owner Name</label>
      <div class="field-wrap"><i class="fa-solid fa-user input-icon"></i>
        <input id="ownerName" placeholder="Owner's name" class="input-field" readonly></div>
    </div>

    <div>
      <label for="prefDate" class="block text-sm font-semibold mb-1.5">Preferred Exchange Date</label>
      <div class="field-wrap"><i class="fa-regular fa-calendar input-icon"></i>
        <input id="prefDate" type="date" class="input-field"></div>
    </div>

    <div>
      <label for="reqMessage" class="block text-sm font-semibold mb-1.5">Message</label>
      <textarea id="reqMessage" rows="3" placeholder="Write a message to the owner..." class="input-field !pl-4"></textarea>
    </div>

    <button type="submit" class="btn-primary w-full py-3 flex items-center justify-center gap-2">
      <i class="fa-solid fa-paper-plane"></i> Send Request
    </button>
  </form>
</main>

<footer class="site-footer">
  <div class="max-w-7xl mx-auto px-5 md:px-8 py-6 flex flex-col md:flex-row items-center justify-between gap-3 text-xs text-[#bfe0da]">
    <div class="flex items-center gap-2"><span class="logo-badge scale-75"><i class="fa-solid fa-book-open-reader"></i></span> Swapmybook</div>
    <p>© 2026 SwapMyBook. All rights reserved.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script src="script.js"></script>
</body>
</html>
