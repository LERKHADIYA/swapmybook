<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen">
<a href="#main" class="skip-link">Skip to content</a>

  <div class="max-w-7xl mx-auto px-5 md:px-8 flex items-center justify-between h-16">
    <a href="index.html" class="flex items-center gap-2">
      <span class="logo-badge"><i class="fa-solid fa-book-open-reader"></i></span>
      <span class="font-display font-bold text-lg">Swap<span class="brand-gradient-text">mybook</span></span>
    </a>
    <nav class="hidden md:flex items-center gap-7 text-sm">
      <a href="add-book.html" class="nav-link">Add Book</a>
      <a href="search-book.html" class="nav-link">Search</a>
      <a href="exchange-request.html" class="nav-link">Exchange</a>
      <a href="profile.html" class="nav-link active">Profile</a>
      <a href="contact.html" class="nav-link">Contact</a>
      <a href="feedback.html" class="nav-link">Feedback</a>
    </nav>
    <div class="hidden md:flex items-center gap-3">
      <a href="index.html" class="btn-outline px-4 py-2 text-sm">Login</a>
      <a href="register.html" class="btn-primary px-4 py-2 text-sm">Sign Up</a>
    </div>
    <button id="navToggle" class="md:hidden text-xl text-[var(--teal-700)]" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
  </div>
  <div id="mobileMenu" class="hidden md:hidden border-t border-[var(--line)] px-5 py-4 flex flex-col gap-3 text-sm bg-white">
    <a href="add-book.html" class="nav-link">Add Book</a>
    <a href="search-book.html" class="nav-link">Search</a>
    <a href="exchange-request.html" class="nav-link">Exchange</a>
    <a href="profile.html" class="nav-link">Profile</a>
    <a href="contact.html" class="nav-link">Contact</a>
    <a href="feedback.html" class="nav-link">Feedback</a>
    <a href="index.html" class="btn-outline px-4 py-2 text-sm text-center">Login</a>
  </div>
</header>

<main id="main" class="max-w-3xl mx-auto px-5 md:px-8 py-10 md:py-14">
  <div class="text-center mb-8" data-aos="fade-up">
    <div class="w-14 h-14 mx-auto rounded-2xl bg-[var(--teal-700)]/10 text-[var(--teal-700)] flex items-center justify-center mb-4 text-2xl"><i class="fa-solid fa-id-card"></i></div>
    <h1 class="font-display text-2xl md:text-3xl font-bold">My Profile</h1>
    <p class="text-[var(--muted)] text-sm mt-1">Keep your details up to date.</p>
  </div>

  <form data-demo-form data-success-text="Profile updated successfully!" class="card p-7 md:p-10 space-y-5" novalidate data-aos="fade-up" data-aos-delay="100">
    <div class="flex items-center gap-4">
      <div class="w-20 h-20 rounded-full bg-[var(--teal-700)]/10 text-[var(--teal-700)] flex items-center justify-center text-3xl">
        <i class="fa-solid fa-user"></i>
      </div>
      <label for="profilePhoto" class="btn-outline px-4 py-2 text-sm cursor-pointer">
        <span data-file-label="profilePhoto"><i class="fa-solid fa-camera mr-1"></i> Choose File</span>
      </label>
      <input id="profilePhoto" type="file" accept="image/*" class="file-input hidden">
    </div>

    <div class="grid md:grid-cols-2 gap-5">
      <div>
        <label for="pFullName" class="block text-sm font-semibold mb-1.5">Full Name</label>
        <div class="field-wrap"><i class="fa-solid fa-user input-icon"></i>
          <input id="pFullName" placeholder="Enter your name" class="input-field"></div>
      </div>
      <div>
        <label for="pEmail" class="block text-sm font-semibold mb-1.5">Email Address</label>
        <div class="field-wrap"><i class="fa-solid fa-envelope input-icon"></i>
          <input id="pEmail" type="email" placeholder="Enter your email" class="input-field"></div>
      </div>
      <div>
        <label for="pMobile" class="block text-sm font-semibold mb-1.5">Mobile Number</label>
        <div class="field-wrap"><i class="fa-solid fa-phone input-icon"></i>
          <input id="pMobile" type="tel" placeholder="Enter mobile number" class="input-field"></div>
      </div>
      <div>
        <label for="pCollege" class="block text-sm font-semibold mb-1.5">College Name</label>
        <div class="field-wrap"><i class="fa-solid fa-school input-icon"></i>
          <input id="pCollege" placeholder="Enter college name" class="input-field"></div>
      </div>
      <div>
        <label for="pDept" class="block text-sm font-semibold mb-1.5">Department</label>
        <div class="field-wrap"><i class="fa-solid fa-building-columns input-icon"></i>
          <input id="pDept" placeholder="Enter department" class="input-field"></div>
      </div>
      <div>
        <label for="pSemester" class="block text-sm font-semibold mb-1.5">Semester</label>
        <div class="field-wrap"><i class="fa-solid fa-layer-group input-icon"></i>
          <select id="pSemester" class="input-field appearance-none">
            <option value="">Select Semester</option>
            <option>Semester 1</option><option>Semester 2</option><option>Semester 3</option>
            <option>Semester 4</option><option>Semester 5</option><option>Semester 6</option>
          </select></div>
      </div>
    </div>

    <div>
      <label for="pNewPass" class="block text-sm font-semibold mb-1.5">Change Password</label>
      <div class="field-wrap"><i class="fa-solid fa-lock input-icon"></i>
        <input id="pNewPass" type="password" placeholder="Enter new password" class="input-field pr-11">
        <button type="button" data-toggle-pass="pNewPass" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-[var(--muted)]" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
      </div>
    </div>

    <button type="submit" class="btn-primary w-full py-3 flex items-center justify-center gap-2">
      <i class="fa-solid fa-floppy-disk"></i> Update Profile
    </button>
  </form>
</main>

<footer class="site-footer">
  <div class="max-w-7xl mx-auto px-5 md:px-8 py-6 flex flex-col md:flex-row items-center justify-between gap-3 text-xs text-[#bfe0da]">
    <div class="flex items-center gap-2"><span class="logo-badge scale-75"><i class="fa-solid fa-book-open-reader"></i></span> Swapmybook</div>
    <p>© 2026 SwapMyBook. All rights reserved.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script src="script.js"></script>
</body>
</html>
